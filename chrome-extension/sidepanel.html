<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Intelligence - Job Importer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #3b82f6;
      border-radius: 6px;
    }
    h2 {
      font-size: 16px;
      margin: 0;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
      word-break: break-all;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: #0284c7;
      color: white;
      font-size: 11px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <h2>Resume Intelligence</h2>
  </div>

  <div class="card">
    <span class="badge">Side-Panel Importer</span>
    <p style="font-size: 13px; color: #cbd5e1; margin-top: 8px;">
      Import active job posting directly from your current browser tab. Bypasses 100% of Cloudflare & anti-bot blocks.
    </p>
    <button id="importBtn" class="btn">🚀 Import Current Job</button>
    <div id="status" class="status">Ready to import...</div>
  </div>

  <div class="card">
    <h3 style="font-size: 13px; margin-top: 0; color: #94a3b8;">Extraction Summary</h3>
    <div id="summary" style="font-size: 12px; color: #cbd5e1;">No job imported yet.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
